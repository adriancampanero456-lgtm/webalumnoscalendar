</div>

<script>

let eventos = [];

let filtroActual = "ALL";


/* ==========================================
   CURSO 2026-2027
========================================== */

let fechaActual = new Date();

let mesActual =
    fechaActual.getMonth() + 1;

let añoActual =
    fechaActual.getFullYear();


const nombresMeses = [

    "Enero",
    "Febrero",
    "Marzo",
    "Abril",
    "Mayo",
    "Junio",
    "Julio",
    "Agosto",
    "Septiembre",
    "Octubre",
    "Noviembre",
    "Diciembre"

];


/* ==========================================
   CARGAR DATOS
========================================== */

fetch("datos.txt")

    .then(res => res.text())

    .then(texto => {

        const lineas = texto
            .trim()
            .split("\n")
            .filter(linea => linea.trim() !== "");


        eventos = lineas.map(linea => {

            const partes = linea.split(",");


            const dia =
                parseInt(partes[0]);

            const mes =
                parseInt(partes[1]);

            const categoria =
                partes[2].trim();

            const asignatura =
                partes[3].trim();


            /*
                La descripción puede contener comas,
                por eso cogemos todo lo que queda.
            */

            const descripcion =
                partes
                    .slice(4)
                    .join(",")
                    .trim();


            return {

                dia: dia,
                mes: mes,
                categoria: categoria,
                asignatura: asignatura,
                descripcion: descripcion

            };

        });


        actualizarVista();

    })

    .catch(error => {

        console.error(
            "Error cargando datos.txt:",
            error
        );

    });


/* ==========================================
   ACTUALIZAR VISTA
========================================== */

function actualizarVista() {

    document.getElementById(
        "mesActual"
    ).textContent =

        `${nombresMeses[mesActual - 1]} ${añoActual}`;


    generarCalendario(
        mesActual,
        añoActual
    );

}


/* ==========================================
   GENERAR CALENDARIO
========================================== */

function generarCalendario(mes, año) {

    const calendario = document.getElementById("calendario");

    // Animación suave al cambiar de mes
    calendario.classList.remove("cambiando");
    void calendario.offsetWidth;
    calendario.classList.add("cambiando");

    calendario.innerHTML = "";

    const diasMes = new Date(año, mes, 0).getDate();

    /*
        Recorremos todos los días reales del mes.
        Solo mostramos lunes, martes, miércoles,
        jueves y viernes.
    */

    let primerDiaSemana = new Date(año, mes - 1, 1).getDay();

    /*
        Convertimos:

        Domingo = 0
        Lunes = 1
        Martes = 2
        Miércoles = 3
        Jueves = 4
        Viernes = 5
        Sábado = 6

        a:

        Lunes = 0
        Martes = 1
        Miércoles = 2
        Jueves = 3
        Viernes = 4
        Sábado = 5
        Domingo = 6
    */

    primerDiaSemana =
        primerDiaSemana === 0
            ? 6
            : primerDiaSemana - 1;


    /*
        Creamos 6 semanas × 5 días
    */

    for (let semana = 0; semana < 6; semana++) {

        for (let columna = 0; columna < 5; columna++) {

            const celda = document.createElement("div");

            celda.classList.add("dia");


            /*
                Posición real dentro del mes.

                Ejemplo:

                Si el día 1 es miércoles:

                lunes    martes    miércoles
                  1          2          3
            */

            const posicion =
                semana * 7 +
                columna -
                primerDiaSemana;


            const diaNumero =
                posicion + 1;


            /*
                Si no existe ese día,
                dejamos la celda vacía.
            */

            if (
                diaNumero < 1 ||
                diaNumero > diasMes
            ) {

                calendario.appendChild(celda);

                continue;

            }


            /*
                Comprobar el día real.
            */

            const fecha =
                new Date(
                    año,
                    mes - 1,
                    diaNumero
                );


            const diaSemana =
                fecha.getDay();


            /*
                Domingo = 0
                Sábado = 6

                Si es fin de semana,
                no debería aparecer.
            */

            if (
                diaSemana === 0 ||
                diaSemana === 6
            ) {

                calendario.appendChild(celda);

                continue;

            }


            /*
                Número del día
            */

            const numero =
                document.createElement("strong");

            numero.textContent =
                diaNumero;

            celda.appendChild(numero);


            /*
                Buscar eventos
            */

            const eventosDia =
                eventos.filter(e =>

                    Number(e.dia) === diaNumero &&
                    Number(e.mes) === mes

                );


            /*
                Mostrar eventos
            */

            eventosDia.forEach(e => {

                if (
                    filtroActual !== "ALL" &&
                    filtroActual !== e.categoria
                ) {

                    return;

                }


                const eventoDiv =
                    document.createElement("div");


                eventoDiv.classList.add(
                    "evento",
                    e.categoria
                );


                /*
                    ASIGNATURA
                */

                const asignatura =
                    document.createElement("strong");

                asignatura.classList.add(
                    "asignatura"
                );

                asignatura.textContent =
                    e.asignatura;


                /*
                    DESCRIPCIÓN
                */

                const descripcion =
                    document.createElement("span");

                descripcion.textContent =
                    e.descripcion;


                eventoDiv.appendChild(
                    asignatura
                );

                eventoDiv.appendChild(
                    document.createElement("br")
                );

                eventoDiv.appendChild(
                    descripcion
                );


                /*
                    Al hacer clic
                */

                eventoDiv.onclick = () => {

                    alert(
                        e.asignatura +
                        "\n\n" +
                        e.descripcion
                    );

                };


                celda.appendChild(
                    eventoDiv
                );

            });


            calendario.appendChild(celda);

        }

    }

}


/* ==========================================
   FILTROS
========================================== */

function filtrar(categoria) {

    filtroActual =
        categoria;

    actualizarVista();

}


/* ==========================================
   CAMBIAR MES
========================================== */

function cambiarMes(direccion) {

    mesActual += direccion;


    /*
        Diciembre → Enero
    */

    if (
        mesActual > 12
    ) {

        mesActual = 1;

        añoActual++;

    }


    /*
        Enero → Diciembre
    */

    if (
        mesActual < 1
    ) {

        mesActual = 12;

        añoActual--;

    }


    actualizarVista();

}


/* ==========================================
   MOSTRAR FECHA DE HOY
========================================== */

function mostrarDiaHoy() {

    const hoy =
        new Date();


    const dias = [

        "domingo",
        "lunes",
        "martes",
        "miércoles",
        "jueves",
        "viernes",
        "sábado"

    ];


    const meses = [

        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"

    ];


    document.getElementById(
        "hoy"
    ).textContent =

        `Hoy es ${dias[hoy.getDay()]} ` +
        `${hoy.getDate()} de ` +
        `${meses[hoy.getMonth()]} de ` +
        `${hoy.getFullYear()}`;

}


mostrarDiaHoy();

</script>
