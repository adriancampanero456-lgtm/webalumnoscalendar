<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario - 4º ESO 2026-2027</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>

    <h1>Calendario - 4º ESO</h1>
    <h2>Curso 2026-2027</h2>
    <h3 id="hoy"></h3>

    <button id="temaBtn" class="tema-btn" onclick="cambiarTema()">
        🌙
    </button>

</header>


<div class="contenedor">

    <!-- FILTROS -->
    <div class="menu">

        <button onclick="filtrar('ALL')">
            Todos
        </button>

        <button onclick="filtrar('E')">
            Exámenes
        </button>

        <button onclick="filtrar('T')">
            Trabajos
        </button>

        <button onclick="filtrar('R')">
            Lecturas
        </button>

        <button onclick="filtrar('O')">
            Exposiciones
        </button>

        <button onclick="filtrar('C')">
            Cumpleaños
        </button>

    </div>


    <!-- LEYENDA -->
    <div class="leyenda">

        <strong>Leyenda:</strong>

        <div class="leyenda-item">
            <span class="color E"></span>
            Exámenes
        </div>

        <div class="leyenda-item">
            <span class="color T"></span>
            Trabajos
        </div>

        <div class="leyenda-item">
            <span class="color R"></span>
            Lecturas
        </div>

        <div class="leyenda-item">
            <span class="color O"></span>
            Exposiciones
        </div>

        <div class="leyenda-item">
            <span class="color C"></span>
            Cumpleaños
        </div>

    </div>


    <!-- CALENDARIO -->
    <div class="zona-calendario">

        <div class="mes-control">

            <button onclick="cambiarMes(-1)">
                ⬅
            </button>

            <span id="mesActual"></span>

            <button onclick="cambiarMes(1)">
                ➡
            </button>

        </div>


        <!-- DÍAS DE LA SEMANA -->
        <div class="dias-semana">

            <div>L</div>
            <div>M</div>
            <div>X</div>
            <div>J</div>
            <div>V</div>
            <div>S</div>
            <div>D</div>

        </div>


        <!-- DÍAS DEL MES -->
        <div
            class="calendario"
            id="calendario">
        </div>

    </div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

let eventos = [];
let filtroActual = "ALL";


/* ==========================================
   FECHA
========================================== */

let fechaActual = new Date();

let mesActual =
    fechaActual.getMonth() + 1;

let añoActual =
    fechaActual.getFullYear();


const nombresMeses = [
    "Enero",
    "Febrero",
    "Marzo",
    "Abril",
    "Mayo",
    "Junio",
    "Julio",
    "Agosto",
    "Septiembre",
    "Octubre",
    "Noviembre",
    "Diciembre"
];


/* ==========================================
   CARGAR DATOS
========================================== */

fetch("datos.txt")

    .then(res => res.text())

    .then(texto => {

        const lineas = texto
            .trim()
            .split("\n")
            .filter(linea =>
                linea.trim() !== ""
            );


        eventos = lineas.map(linea => {

            const partes =
                linea.split(",");


            const dia =
                parseInt(partes[0]);

            const mes =
                parseInt(partes[1]);

            const categoria =
                partes[2].trim();

            const asignatura =
                partes[3].trim();


            /*
                La descripción puede contener comas.
            */

            const descripcion =
                partes
                    .slice(4)
                    .join(",")
                    .trim();


            return {
                dia,
                mes,
                categoria,
                asignatura,
                descripcion
            };

        });


        actualizarVista();

    })

    .catch(error => {

        console.error(
            "Error cargando datos.txt:",
            error
        );

    });


/* ==========================================
   ACTUALIZAR VISTA
========================================== */

function actualizarVista() {

    document.getElementById(
        "mesActual"
    ).textContent =
        `${nombresMeses[mesActual - 1]} ${añoActual}`;


    generarCalendario(
        mesActual,
        añoActual
    );

}


/* ==========================================
   GENERAR CALENDARIO
========================================== */

function generarCalendario(mes, año) {

    const calendario =
        document.getElementById(
            "calendario"
        );


    /*
        Animación de cambio de mes
    */

    calendario.classList.remove(
        "cambiando"
    );

    void calendario.offsetWidth;

    calendario.classList.add(
        "cambiando"
    );


    calendario.innerHTML = "";


    /*
        Número de días del mes
    */

    const diasMes =
        new Date(
            año,
            mes,
            0
        ).getDate();


    /*
        Día de la semana del día 1.

        Domingo = 0
        Lunes = 1
        Martes = 2
        Miércoles = 3
        Jueves = 4
        Viernes = 5
        Sábado = 6
    */

    let primerDia =
        new Date(
            año,
            mes - 1,
            1
        ).getDay();


    /*
        Convertimos para empezar
        por lunes:

        Lunes = 0
        Martes = 1
        ...
        Domingo = 6
    */

    primerDia =
        primerDia === 0
            ? 6
            : primerDia - 1;


    /*
        6 semanas × 7 días
    */

    for (
        let posicion = 0;
        posicion < 42;
        posicion++
    ) {


        const celda =
            document.createElement(
                "div"
            );


        celda.classList.add(
            "dia"
        );


        /*
            Calcular número del día
        */

        const diaNumero =
            posicion -
            primerDia +
            1;


        /*
            Celdas vacías
        */

        if (
            diaNumero < 1 ||
            diaNumero > diasMes
        ) {

            calendario.appendChild(
                celda
            );

            continue;

        }


        /*
            Número del día
        */

        const numero =
            document.createElement(
                "strong"
            );

        numero.textContent =
            diaNumero;


        celda.appendChild(
            numero
        );


        /*
            Eventos de ese día
        */

        const eventosDia =
            eventos.filter(e =>

                Number(e.dia) ===
                    diaNumero &&

                Number(e.mes) ===
                    mes

            );


        eventosDia.forEach(e => {


            /*
                Aplicar filtro
            */

            if (
                filtroActual !== "ALL" &&
                filtroActual !== e.categoria
            ) {

                return;

            }


            const eventoDiv =
                document.createElement(
                    "div"
                );


            eventoDiv.classList.add(
                "evento",
                e.categoria
            );


            /*
                Asignatura
            */

            const asignatura =
                document.createElement(
                    "strong"
                );


            asignatura.classList.add(
                "asignatura"
            );


            asignatura.textContent =
                e.asignatura;


            /*
                Descripción
            */

            const descripcion =
                document.createElement(
                    "span"
                );


            descripcion.textContent =
                e.descripcion;


            eventoDiv.appendChild(
                asignatura
            );


            eventoDiv.appendChild(
                document.createElement(
                    "br"
                )
            );


            eventoDiv.appendChild(
                descripcion
            );


            /*
                Ventana al pulsar
            */

            eventoDiv.onclick = () => {

                alert(
                    e.asignatura +
                    "\n\n" +
                    e.descripcion
                );

            };


            celda.appendChild(
                eventoDiv
            );

        });


        calendario.appendChild(
            celda
        );

    }

}


/* ==========================================
   FILTROS
========================================== */

function filtrar(categoria) {

    filtroActual =
        categoria;

    actualizarVista();

}


/* ==========================================
   CAMBIAR MES
========================================== */

function cambiarMes(direccion) {

    mesActual += direccion;


    if (mesActual > 12) {

        mesActual = 1;
        añoActual++;

    }


    if (mesActual < 1) {

        mesActual = 12;
        añoActual--;

    }


    actualizarVista();

}


/* ==========================================
   FECHA DE HOY
========================================== */

function mostrarDiaHoy() {

    const hoy =
        new Date();


    const dias = [
        "domingo",
        "lunes",
        "martes",
        "miércoles",
        "jueves",
        "viernes",
        "sábado"
    ];


    const meses = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"
    ];


    document.getElementById(
        "hoy"
    ).textContent =

        `Hoy es ${dias[hoy.getDay()]} ` +
        `${hoy.getDate()} de ` +
        `${meses[hoy.getMonth()]} de ` +
        `${hoy.getFullYear()}`;

}


mostrarDiaHoy();


/* ==========================================
   MODO OSCURO
========================================== */

function cambiarTema() {

    document.body.classList.toggle(
        "dark"
    );


    const boton =
        document.getElementById(
            "temaBtn"
        );


    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        boton.textContent = "☀️";

        localStorage.setItem(
            "tema",
            "dark"
        );

    } else {

        boton.textContent = "🌙";

        localStorage.setItem(
            "tema",
            "light"
        );

    }

}


/* ==========================================
   CARGAR TEMA GUARDADO
========================================== */

function cargarTema() {

    const tema =
        localStorage.getItem(
            "tema"
        );


    const boton =
        document.getElementById(
            "temaBtn"
        );


    if (tema === "dark") {

        document.body.classList.add(
            "dark"
        );

        boton.textContent = "☀️";

    } else {

        boton.textContent = "🌙";

    }

}


cargarTema();

</script>

</body>
</html>
